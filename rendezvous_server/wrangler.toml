name = "pc-rendezvous"
main = "src/index.ts"
compatibility_date = "2024-09-25"

[[durable_objects.bindings]]
name = "PAIRING_SESSION"
class_name = "PairingSession"

[exports.PairingSession]
type = "durable-object"
storage = "sqlite"

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[observability.traces]
enabled = false